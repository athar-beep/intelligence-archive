  <path d="M70 70h760v510H70z" fill="none" stroke="#9d7b43" stroke-width="2"/>
  <path d="M92 92h716v466H92z" fill="none" stroke="#b9ad98" stroke-width="1"/>
  <g fill="none" stroke="#9d7b43" stroke-width="2" opacity=".7">
    <circle cx="450" cy="260" r="66"/><circle cx="450" cy="260" r="46"/>
    <path d="M450 177v166M367 260h166M391 201l118 118M509 201 391 319"/>
