<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
  <title id="title">Archival photograph unavailable</title>
  <desc id="desc">A neutral museum-style placeholder for a photograph that could not be loaded.</desc>
